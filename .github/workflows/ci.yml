name: CI

# Runs for pull requests (created, new commits pushed, reopened).
# Pushes to main are checked by pages.yml, which calls this workflow before deploying,
# so there is deliberately no `push` trigger here (it would run the check twice).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  code-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      # Coverage is reported in the job summary and pull request comment; no coverage threshold is enforced.
      - name: Unit tests
        run: |
          uv run pytest \
            --cov=tastingsets \
            --cov-report=term-missing \
            --cov-report=xml:cobertura.xml

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Add Coverage Summary to Job Summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md

  data-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      # Warnings (e.g. a spirit whose distillery has no entry) show up as annotations,
      # the job only fails on errors.
      - name: Validate data
        run: uv run tastingsets validate

      - name: Build site (smoke test)
        run: uv run tastingsets build --out dist
