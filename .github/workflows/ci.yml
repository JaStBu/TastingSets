name: CI

# Runs for pull requests (created, new commits pushed, reopened).
# Pushes to main are checked by pages.yml, which calls this workflow before deploying,
# so there is deliberately no `push` trigger here (it would run the check twice).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Unit tests
        run: uv run pytest

      # Warnings (e.g. a spirit whose distillery has no entry) show up as annotations,
      # the job only fails on errors.
      - name: Validate data
        run: uv run tastingsets validate

      - name: Build site (smoke test)
        run: uv run tastingsets build --out dist
