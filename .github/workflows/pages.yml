name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # A release tag rebuilds the site so that the footer shows the clean version (e.g. 0.2.0)
    # instead of a dev version. Needs a tag rule `v*` in the `github-pages` environment.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Lint, format, tests, data validation and a smoke build (see ci.yml).
  # The deployment only starts if this succeeds.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      # Aborts on data errors, so no separate validation step is needed here.
      - name: Build site
        run: uv run tastingsets build --out dist --base-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
