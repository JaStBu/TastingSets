name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # A release tag rebuilds the site so that the footer shows the clean version (e.g. 0.2.0)
    # instead of a dev version. Needs a tag rule `v*` in the `github-pages` environment.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Code tests and data validation with a smoke build (see ci.yml).
  # The deployment only starts if this succeeds.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Diagnose version
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git tag --points-at HEAD
          uv run python -c "from tastingsets import __version__; print(__version__)"

      # Aborts on data errors, so no separate validation step is needed here.
      - name: Build site
        run: uv run tastingsets build --out dist --base-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
