name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # A release tag rebuilds the site so that the footer shows the clean version (e.g. 0.2.0)
    # instead of a dev version. Needs a tag rule `v*` in the `github-pages` environment.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Code tests and data validation with a smoke build (see ci.yml).
  # The deployment only starts if this succeeds.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history and tags, the package version is derived from them

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Diagnose version
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git tag --points-at HEAD
          uv run python -c "from tastingsets import __version__; print(__version__)"

      # Aborts on data errors, so no separate validation step is needed here.
      - name: Build site
        run: uv run tastingsets build --out dist --base-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
