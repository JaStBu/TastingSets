[project]
name = "tastingsets"
dynamic = ["version"]
description = "Overview of the contents of various tasting sets"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.11",
    "jinja2>=3.1",
    "babel>=2.14",
    "pycountry>=24",
]

[project.urls]
Repository = "https://github.com/JaStBu/TastingSets"

[project.scripts]
tastingsets = "tastingsets.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from Git tags (v0.2.0 -> 0.2.0), see README "Versioning and releases".
[tool.hatch.version]
source = "vcs"

[tool.uv]
required-version = ">=0.5"
# Rebuild the editable install (and so __version__) when a commit or tag changes.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/tastingsets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
